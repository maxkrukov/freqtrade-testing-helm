---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "freqtrade-testing.fullname" . }}-config
  labels: {{ include "freqtrade-testing.labels" . | nindent 4 }}
type: Opaque
stringData:
  config.json: |-
{{- $base := .Values.config | toJson | fromJson }}
{{- $apiDefaults := dict "enabled" true "listen_ip_address" "0.0.0.0" "listen_port" 8080 }}
{{- $apiOverrides := dict "api_server" (mergeOverwrite $apiDefaults .Values.config.api_server) }}
{{- $withApi := mergeOverwrite $base $apiOverrides }}
{{- $password := include "freqtrade-testing.apiPassword" . }}
{{- $apiWithPassword := dict "api_server" (mergeOverwrite ($withApi.api_server | default dict) (dict "password" $password)) }}
{{- $merged := mergeOverwrite $withApi $apiWithPassword }}
{{ toPrettyJson $merged | nindent 4 }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "freqtrade-testing.fullname" . }}-api
  labels: {{ include "freqtrade-testing.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.config.api_server.username | default "admin" | quote }}
  password: {{ include "freqtrade-testing.apiPassword" . | quote }}
