---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "freqtrade-testing.fullname" . }}-config
  labels: {{ include "freqtrade-testing.labels" . | nindent 4 }}
data:
  config.json: |-
{{ toPrettyJson .Values.config | nindent 4 }}
  {{ .Values.strategyName }}.py: |-
{{ tpl .Values.strategy . | nindent 4 }}

{{- if .Values.bot.configOverride.enabled}}
{{- $file1 := .Values.config | toJson | fromJson }}
{{- $file2 := .Values.bot.configOverride.config | toJson | fromJson }}
{{- $merged := mergeOverwrite $file1 $file2 }}
  config-bot.json: |-
{{- toPrettyJson $merged | nindent 4 }}
{{- end }}

---

{{- if and .Values.pvc.data.enabled (not .Values.pvc.data.useExistingPVC) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "freqtrade-testing.fullname" . }}-data
  labels: {{ include "freqtrade-testing.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.pvc.data.accessMode }}
  resources:
    requests:
      storage: {{ .Values.pvc.data.size }}
  {{- if .Values.pvc.data.storageClass }}
  storageClassName: {{ .Values.pvc.data.storageClass }}
  {{- end }}
{{- end }}

{{- if and .Values.pvc.strategy.enabled (not .Values.pvc.strategy.useExistingPVC) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "freqtrade-testing.fullname" . }}-strategy
  labels: {{ include "freqtrade-testing.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.pvc.strategy.accessMode }}
  resources:
    requests:
      storage: {{ .Values.pvc.strategy.size }}
  {{- if .Values.pvc.strategy.storageClass }}
  storageClassName: {{ .Values.pvc.strategy.storageClass }}
  {{- end }}
{{- end }}

{{- if or .Values.testing.backtesting.enabled .Values.testing.hyperopt.enabled }}

# Calculate backtesting and hyperopt time ranges
{{- $ba := printf "-%dh" (mul 24 (add .Values.testing.backtesting.days .Values.testing.backtesting.offset )) }}
{{- $bo := printf "-%dh" (mul 24 .Values.testing.backtesting.offset ) }}

{{- $ha := printf "-%dh" (mul 24 (add .Values.testing.hyperopt.days .Values.testing.hyperopt.offset )) }}
{{- $ho := printf "-%dh" (mul 24 .Values.testing.hyperopt.offset ) }}

---
{{- if .Values.testing.backtesting.ui.enabled }}
apiVersion: apps/v1
kind: Deployment
{{- else }}
apiVersion: batch/v1
kind: Job
{{- end }}
metadata:
  name: job-{{ include "freqtrade-testing.fullname" . }}-{{ now | unixEpoch }}
  labels:
    app: job-{{ include "freqtrade-testing.fullname" . }}
spec:
  {{- if (not .Values.testing.backtesting.ui.enabled) }}
  backoffLimit: 0
  {{- else }}
  replicas: 1
  selector:
    matchLabels:
      app: job-{{ include "freqtrade-testing.fullname" . }}
  strategy:
    type: Recreate
  {{- end }}
  template:
    metadata:
      annotations:
        rollme: {{ randAlphaNum 5 | quote }}
      labels:
        app: job-{{ include "freqtrade-testing.fullname" . }}
    spec:
      initContainers:
      {{- if .Values.pvc.fixPermissions }}
      - name: fix-permissions
        image: busybox
        command: ["sh", "-c", "chmod 777 /data /strategies"]
        volumeMounts:
          - name: data
            mountPath: /data
          - mountPath: /strategies
            name: strategy
      {{- end }}
      {{- if .Values.testing.download_data.enabled }}
      - name: download-data
        image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
        imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
        command:
        - freqtrade
        args:
        - download-data
        {{- if .Values.testing.download_data.dl_trades }}
        - --dl-trades
        {{- end }}
        - --pairs
        {{- concat .Values.testing.download_data.pair_whitelist .Values.config.exchange.pair_whitelist | uniq | toYaml | nindent 8 }}
        - --days
        - "{{ .Values.testing.download_data.days }}"
        - --timeframes
        {{- ( concat ( list .Values.config.timeframe ) .Values.testing.download_data.timeframes ) | uniq | toYaml | nindent 8 }}
        - --datadir
        - /data/{{ .Values.config.exchange.name | default "binance" }}
        - --config
        - /freqtrade/config/config.json
        {{- with .Values.testing.download_data.extraArgs }}
        {{ . | toYaml | nindent 8 }}
        {{- end }}
        volumeMounts:
        - mountPath: /data
          name: data
        - mountPath: /freqtrade/config/config.json
          name: configmap
          subPath: config.json
      {{- end }}

      {{- if and .Values.testing.backtesting.enabled (not .Values.testing.backtesting.ui.enabled) (not .Values.testing.hyperopt.enabled) }}
      containers:
      {{- end }}

      {{- if and (not .Values.testing.backtesting.enabled) .Values.testing.hyperopt.enabled }}
      containers:
      {{- end }}

      {{- if .Values.testing.hyperopt.enabled }}
      - name: hyperopt
        image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
        imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
        command:
        - freqtrade
        args:
        - hyperopt
        - --config
        - /freqtrade/config/config.json
        - --datadir
        - /data/{{ .Values.config.exchange.name | default "binance" }}
        - --hyperopt-loss
        - {{ .Values.testing.hyperopt.hyperoptStrategy }}
        - --spaces
        {{ .Values.testing.hyperopt.spaces | toYaml | nindent 8 }}
        - --strategy
        - {{ .Values.strategyName }}
        {{- if .Values.testing.hyperopt.fee }}
        - --fee
        - {{ .Values.testing.hyperopt.fee | quote }}
        {{- end }}
        - -e
        - "{{ .Values.testing.hyperopt.tries }}"
        {{- if .Values.testing.hyperopt.days }}
        - --timerange
        - {{ now | mustDateModify $ha | date "20060102-" }}{{ now | mustDateModify $ho | date "20060102" }}
        {{- end }}
        {{- with .Values.testing.hyperopt.extraArgs }}
        {{ . | toYaml | nindent 8 }}
        {{- end }}
        volumeMounts:
        - mountPath: /data
          name: data
        - mountPath: /freqtrade/user_data/strategies
          name: strategy
        - mountPath: /freqtrade/config/config.json
          name: configmap
          subPath: config.json
        - mountPath: /freqtrade/user_data/strategies/{{ .Values.strategyName }}.py
          name: configmap
          subPath: {{ .Values.strategyName }}.py
        resources:
          {{- toYaml .Values.resources | nindent 12 }}
      {{- end }}

      {{- if and (not .Values.testing.backtesting.ui.enabled) .Values.testing.backtesting.enabled .Values.testing.hyperopt.enabled }}
      containers:
      {{- end }}

      {{- if .Values.testing.backtesting.enabled }}
      - name: backtesting
        image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
        imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
        command:
        - freqtrade
        args:
        - backtesting
        - --config
        - /freqtrade/config/config.json
        - --datadir
        - /data/{{ .Values.config.exchange.name | default "binance" }}
        - --breakdown
        - {{ .Values.testing.backtesting.breakdown }}
        - --strategy-list
        - {{ .Values.strategyName }}
        {{- if .Values.testing.backtesting.days }}
        - --timerange
        - {{ now | mustDateModify $ba | date "20060102-" }}{{ now | mustDateModify $bo | date "20060102" }}
        {{- end }}
        {{- if .Values.testing.backtesting.fee }}
        - --fee
        - {{ .Values.testing.backtesting.fee | quote }}
        {{- end }}
        {{- with .Values.testing.backtesting.extraArgs }}
        {{- . | toYaml | nindent 8 }}
        {{- end }}
        volumeMounts:
        - mountPath: /data
          name: data
        - mountPath: /freqtrade/user_data/strategies
          name: strategy
        - mountPath: /freqtrade/config/config.json
          name: configmap
          subPath: config.json
        - mountPath: /freqtrade/user_data/strategies/{{ .Values.strategyName }}.py
          name: configmap
          subPath: {{ .Values.strategyName }}.py
        - mountPath: /freqtrade/user_data/backtest_results
          name: results
        resources:
          {{- toYaml .Values.resources | nindent 12 }}
      {{- if .Values.testing.backtesting.ui.enabled }}
      containers:
      - name: backtesting-ui
        image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
        imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        command:
        - freqtrade
        args:
        - webserver
        - --config
        - /freqtrade/config/config.json
        - --datadir
        - /data/{{ .Values.config.exchange.name | default "binance" }}
        {{- with .Values.testing.backtesting.ui.extraArgs }}
        {{- . | toYaml | nindent 8 }}
        {{- end }}
        volumeMounts:
        - mountPath: /data
          name: data
        - mountPath: /freqtrade/user_data/strategies
          name: strategy
        - mountPath: /freqtrade/config/config.json
          name: configmap
          subPath: config.json
        - mountPath: /freqtrade/user_data/strategies/{{ .Values.strategyName }}.py
          name: configmap
          subPath: {{ .Values.strategyName }}.py
        - mountPath: /freqtrade/user_data/backtest_results
          name: results
        resources:
          {{- toYaml .Values.resources | nindent 12 }}
      {{- end }}
      {{- end }}

      {{- if (not .Values.testing.backtesting.ui.enabled) }}
      restartPolicy: Never
      {{- end }}

      {{- if .Values.nodeSelector }}
      nodeSelector:
{{ toYaml .Values.nodeSelector | indent 8 }}
      {{- end }}
      {{- if .Values.affinity }}
      affinity:
{{ toYaml .Values.affinity | indent 8 }}
      {{- end }}
      {{- if .Values.tolerations }}
      tolerations:
{{ toYaml .Values.tolerations | indent 8 }}
      {{- end }}
      volumes:
      - name: data
        {{- if .Values.pvc.data.useExistingPVC }}
        persistentVolumeClaim:
          claimName: {{ .Values.pvc.data.existingPVCName }}
        {{- else if .Values.pvc.data.enabled }}
        persistentVolumeClaim:
          claimName: {{ include "freqtrade-testing.fullname" . }}-data
        {{- else }}
        emptyDir: {}
        {{- end }}
      - name: strategy
        {{- if .Values.pvc.strategy.useExistingPVC }}
        persistentVolumeClaim:
          claimName: {{ .Values.pvc.strategy.existingPVCName }}
        {{- else if .Values.pvc.strategy.enabled }}
        persistentVolumeClaim:
          claimName: {{ include "freqtrade-testing.fullname" . }}-strategy
        {{- else }}
        emptyDir: {}
        {{- end }}
      - name: configmap
        configMap:
          name: {{ include "freqtrade-testing.fullname" . }}-config
      - name: results
        emptyDir: {}
{{- end }}

{{- if .Values.testing.backtesting.ui.enabled }}
{{- if .Values.testing.backtesting.ui.ingress.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "freqtrade-testing.fullname" . }}-jobsvc
  labels:
    app: job-{{ include "freqtrade-testing.fullname" . }}
spec:
  type: {{ .Values.bot.service.type | default "ClusterIP" }}
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: job-{{ include "freqtrade-testing.fullname" . }}

---
{{ $nm := include "freqtrade-testing.fullname" . }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "freqtrade-testing.fullname" . }}-job
  labels:
    app: job-{{ include "freqtrade-testing.fullname" . }}
  annotations:
    {{- if .Values.testing.backtesting.ui.ingress.annotations }}
    {{ toYaml .Values.testing.backtesting.ui.ingress.annotations | nindent 4 }}
    {{- end }}
spec:
  {{- if .Values.testing.backtesting.ui.ingress.tls }}
  tls:
  - hosts:
      {{- range .Values.testing.backtesting.ui.ingress.hosts }}
      - {{ . }}
      {{- end }}
    secretName: {{ .Values.testing.backtesting.ui.ingress.tlsSecretName }}
  {{- end }}
  ingressClassName: {{ .Values.testing.backtesting.ui.ingress.ingressClassName }}
  rules:
  {{- range .Values.testing.backtesting.ui.ingress.hosts }}
  - host: {{ . }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ $nm }}-jobsvc
            port:
              number: 8080
  {{- end }}
{{- end }}
{{- end }}




