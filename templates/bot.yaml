{{- if .Values.bot.enabled }}
{{- if .Values.bot.ingress.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "freqtrade-testing.fullname" . }}-svc
  labels: {{ include "freqtrade-testing.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector: {{ include "freqtrade-testing.labels" . | nindent 4 }}
---
{{ $nm := include "freqtrade-testing.fullname" . }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "freqtrade-testing.fullname" . }}
  labels: {{ include "freqtrade-testing.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.bot.ingress.annotations }}
    {{ toYaml .Values.bot.ingress.annotations | nindent 4 }}
    {{- end }}
spec:
  {{- if .Values.bot.ingress.tls }}
  tls:
  - hosts:
      {{- range .Values.bot.ingress.hosts }}
      - {{ . }}
      {{- end }}
    secretName: {{ .Values.bot.ingress.tlsSecretName }}
  {{- end }}
  ingressClassName: {{ .Values.bot.ingress.ingressClassName }}
  rules:
  {{- range .Values.bot.ingress.hosts }}
  - host: {{ . }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ $nm }}-svc
            port:
              number: 8080
  {{- end }}
{{- end }}

{{- if .Values.bot.pvc.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "freqtrade-testing.fullname" . }}-bot
  labels: {{ include "freqtrade-testing.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.bot.pvc.accessMode }}
  resources:
    requests:
      storage: {{ .Values.bot.pvc.size }}
  {{- if .Values.bot.pvc.storageClass }}
  storageClassName: {{ .Values.bot.pvc.storageClass }}
  {{- end }}
{{- end }}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "freqtrade-testing.fullname" . }}
  labels: {{ include "freqtrade-testing.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {{ include "freqtrade-testing.labels" . | nindent 6 }}
  template:
    metadata:
      labels: {{ include "freqtrade-testing.labels" . | nindent 8 }}
      {{- if .Values.bot.rollme }}
      annotations:
        rollme: {{ randAlphaNum 5 | quote }}
      {{- end }}
    spec:
      {{- if .Values.bot.pvc.fixPermissions }}
      initContainers:
      - name: fix-permissions
        image: busybox
        command: ["sh", "-c", "chmod 777 /data /botdata"]
        volumeMounts:
          - name: bot-data
            mountPath: /botdata
          - mountPath: /data
            name: shared-data
       {{- end }}
      containers:
      - name: bot
        image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
        imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
        command:
        - freqtrade
        args:
        - trade
        - --config
        - /freqtrade/config/config.json
        - --strategy
        - {{ .Values.strategyName }}{{ .Values.config.timeframe }}
        - --db-url
        - {{ .Values.bot.dbURL }}
        {{- with .Values.bot.extraArgs }}
        {{ . | toYaml | nindent 8 }}
        {{- end }}
        ports:
        - name: http
          containerPort: 8080
        volumeMounts:
        - mountPath: /freqtrade/user_data
          name: bot-data
        #- mountPath: /data
        #  name: shared-data
        #  subPath: data
        - mountPath: /freqtrade/user_data/strategies
          name: shared-data
          subPath: strategies
        #- mountPath: /freqtrade/user_data/backtest_results
        #  name: shared-data
        #  subPath: backtest_results
        - mountPath: /freqtrade/config/config.json
          name: configmap
          {{- if .Values.bot.configOverride.enabled}}
          subPath: config-bot.json
          {{- else }}
          subPath: config.json
          {{- end }}
        - mountPath: /freqtrade/user_data/strategies/{{ .Values.strategyName }}{{ .Values.config.timeframe }}.py
          name: configmap
          subPath: {{ .Values.strategyName }}{{ .Values.config.timeframe }}.py
        resources:
          {{- toYaml .Values.bot.resources | nindent 12 }}
      {{- if .Values.bot.nodeSelector }}
      nodeSelector:
        {{ toYaml .Values.bot.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.bot.affinity }}
      affinity:
        {{ toYaml .Values.bot.affinity | nindent 8 }}
      {{- end }}
      {{- if .Values.bot.tolerations }}
      tolerations:
        {{ toYaml .Values.bot.tolerations | nindent 8 }}
      {{- end }}
      volumes:
      - name: bot-data
        {{- if .Values.bot.pvc.useExistingPVC }}
        persistentVolumeClaim:
          claimName: {{ .Values.bot.pvc.existingPVCName }}
        {{- else if .Values.bot.pvc.enabled }}
        persistentVolumeClaim:
          claimName: {{ include "freqtrade-testing.fullname" . }}-bot
        {{- else }}
        emptyDir: {}
        {{- end }}
      - name: shared-data
        {{- if .Values.pvc.sharedData.useExistingPVC }}
        persistentVolumeClaim:
          claimName: {{ .Values.pvc.sharedData.existingPVCName }}
        {{- else if .Values.pvc.sharedData.enabled }}
        persistentVolumeClaim:
          claimName: {{ include "freqtrade-testing.fullname" . }}-shared-data
        {{- else }}
        emptyDir: {}
        {{- end }}
      - name: configmap
        configMap:
          name: {{ include "freqtrade-testing.fullname" . }}-config
{{- end }}
