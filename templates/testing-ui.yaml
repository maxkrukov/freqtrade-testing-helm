{{- if and .Values.testing.enabled  .Values.testing.ui.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "freqtrade-testing.fullname" . }}-ui
  labels:
    app: {{ include "freqtrade-testing.fullname" . }}-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "freqtrade-testing.fullname" . }}-ui
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: {{ include "freqtrade-testing.fullname" . }}-ui
    spec:
      initContainers:
      {{- if .Values.pvc.sharedData.fixPermissions }}
      - name: fix-permissions
        image: busybox
        command: ["sh", "-c", "chmod 777 /data"]
        volumeMounts:
          - name: shared-data
            mountPath: /data
      {{- end }}
      containers:
      - name: backtesting-ui
        image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
        imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        command:
        - freqtrade
        args:
        - webserver
        - --config
        - /freqtrade/config/config.json
        - --datadir
        - /data/{{ .Values.config.exchange.name | default "binance" }}
        {{- with .Values.testing.ui.extraArgs }}
        {{- . | toYaml | nindent 8 }}
        {{- end }}
        volumeMounts:
        - mountPath: /data
          name: shared-data
          subPath: data
        - mountPath: /freqtrade/user_data/strategies
          name: shared-data
          subPath: strategies
        - mountPath: /freqtrade/user_data/backtest_results
          name: shared-data
          subPath: backtest_results
        - mountPath: /freqtrade/config/config.json
          name: configmap
          subPath: config.json
        - mountPath: /freqtrade/user_data/strategies/{{ .Values.strategyName }}{{ .Values.config.timeframe }}.py
          name: configmap
          subPath: {{ .Values.strategyName }}{{ .Values.config.timeframe }}.py
        resources:
          {{- toYaml .Values.resources | nindent 12 }}
      restartPolicy: Always
      {{- if .Values.nodeSelector }}
      nodeSelector:
{{ toYaml .Values.nodeSelector | indent 8 }}
      {{- end }}
      {{- if .Values.affinity }}
      affinity:
{{ toYaml .Values.affinity | indent 8 }}
      {{- end }}
      {{- if .Values.tolerations }}
      tolerations:
{{ toYaml .Values.tolerations | indent 8 }}
      {{- end }}
      volumes:
      - name: shared-data
        {{- if .Values.pvc.sharedData.useExistingPVC }}
        persistentVolumeClaim:
          claimName: {{ .Values.pvc.sharedData.existingPVCName }}
        {{- else if .Values.pvc.sharedData.enabled }}
        persistentVolumeClaim:
          claimName: {{ include "freqtrade-testing.fullname" . }}-shared-data
        {{- else }}
        emptyDir: {}
        {{- end }}
      - name: configmap
        configMap:
          name: {{ include "freqtrade-testing.fullname" . }}-config

{{- if .Values.testing.ui.ingress.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "freqtrade-testing.fullname" . }}-ui
  labels:
    app: {{ include "freqtrade-testing.fullname" . }}-ui
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: {{ include "freqtrade-testing.fullname" . }}-ui

---
{{ $nm := include "freqtrade-testing.fullname" . }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "freqtrade-testing.fullname" . }}-ui
  labels:
    app: {{ include "freqtrade-testing.fullname" . }}-ui
  annotations:
    {{- if .Values.testing.ui.ingress.annotations }}
    {{ toYaml .Values.testing.ui.ingress.annotations | nindent 4 }}
    {{- end }}
spec:
  {{- if .Values.testing.ui.ingress.tls }}
  tls:
  - hosts:
      {{- range .Values.testing.ui.ingress.hosts }}
      - {{ . }}
      {{- end }}
    secretName: {{ .Values.testing.ui.ingress.tlsSecretName }}
  {{- end }}
  ingressClassName: {{ .Values.testing.ui.ingress.ingressClassName }}
  rules:
  {{- range .Values.testing.ui.ingress.hosts }}
  - host: {{ . }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ $nm }}-ui
            port:
              number: 8080
  {{- end }}
{{- end }}
{{- end }}



